<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b0021">
  <title>Bombay Chaat Bhandar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- Styles for the Instagram / Facebook cards (overrides style.css if needed) -->
  <style>
    /* Instagram / Facebook cards (same pink look as the reward cards) */
    .social-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .social-card {
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      min-height: 170px; padding: 18px 12px 0;
      background: #d4199a; color: #fff;           /* pink, like your reward cards */
      border-radius: 20px; text-decoration: none; text-align: center;
      font-weight: 800; line-height: 1.25; overflow: hidden;
    }
    .social-card[hidden] { display: none; }      /* hidden until the link is loaded */
    .social-card small { font-weight: 500; font-size: 14px; }
    .social-card .bump {                          /* dark maroon curve at the bottom */
      width: 100%; height: 62px; margin-top: 10px;
      border-radius: 70px 70px 0 0; background: #3b0021;
      display: flex; align-items: center; justify-content: center;
    }
    .social-card .bump i { font-size: 30px; }
    .social-card:focus-visible { outline: 3px solid #fbbc05; outline-offset: 3px; }
  </style>

  <!-- Google Sign-In library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="topbar" id="topbar" hidden>
        <span class="who" id="who"></span>
        <button class="signout" id="logout" type="button">Sign out</button>
      </div>

      <div class="banner">
        <span class="mascot mascot-left" aria-hidden="true">🍟</span>
        <div class="banner-title">
          <h1 class="fest">BOMBAY<br>CHAAT BHANDAR</h1>
          <p class="cta">Scan · Visit · Win</p>
        </div>
        <span class="mascot mascot-right" aria-hidden="true">🍔</span>
      </div>

      <div class="strip" id="strip" hidden></div>
    </header>

    <main class="sheet">
      <!-- Sign-in view -->
      <section id="login-view" hidden>
        <h2>Sign in to collect rewards</h2>
        <p class="sub">Every time you scan our QR code, your visit is counted and new offers unlock.</p>

        <div class="google-wrap">
          <div id="g_id_onload"
               data-client_id="545672913408-f7eg6idlpuhpcr0ufldakiqtbaq5t9js.apps.googleusercontent.com"
               data-callback="handleGoogle"
               data-auto_prompt="false"></div>
          <div class="g_id_signin"
               data-type="standard"
               data-shape="pill"
               data-theme="outline"
               data-size="large"
               data-text="continue_with"
               data-logo_alignment="left"
               data-width="280"></div>
        </div>

        <p id="google-error" class="error" role="alert" hidden></p>

        <!-- Email form kept but hidden, so script.js still finds its elements -->
        <form id="login-form" novalidate style="display:none">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" inputmode="email"
                 autocomplete="email" placeholder="name@example.com" required>
          <p id="error" class="error" role="alert" hidden></p>
          <button id="submit" class="primary" type="submit">Sign in</button>
        </form>
      </section>

      <!-- Rewards view (shown after sign-in) -->
      <section id="rewards-view" hidden>
        <div class="rewards-head">
          <h2>Visit Rewards</h2>
          <span class="count"><strong id="visit-count">0</strong> <span id="visit-word">visits</span></span>
        </div>

        <div class="tracker" id="tracker"></div>

        <div class="detail" id="detail">
          <div class="detail-top">
            <span class="detail-headline" id="detail-headline"></span>
            <span class="chip" id="detail-chip"></span>
          </div>
          <div class="detail-row">
            <p class="detail-text" id="detail-text"></p>
            <button type="button" class="view-all" id="view-all">View all ›</button>
          </div>
          <button type="button" class="claim-btn" id="claim-btn" hidden>Claim reward</button>
        </div>

        <p class="next" id="next" hidden></p>

        <!-- Instagram and Facebook cards (links come from /api/config) -->
        <div class="social-cards">
          <a href="#" id="insta-link" class="social-card" target="_blank" rel="noopener" hidden>
            <span>Follow us<br>on Instagram</span>
            <span class="bump"><i class="fa-brands fa-instagram"></i></span>
          </a>
          <a href="#" id="fb-link" class="social-card" target="_blank" rel="noopener" hidden>
            <span>Like us<br>on Facebook</span>
            <span class="bump"><i class="fa-brands fa-facebook-f"></i></span>
          </a>
        </div>
      </section>
    </main>

    <footer class="team-up">Team Up!</footer>
  </div>

  <!-- All rewards page (opens from "View all") -->
  <div class="rewards-page" id="rewards-page" hidden>
    <div class="page">
      <header class="page-hero">
        <button type="button" class="back" id="page-back" aria-label="Back">←</button>
        <h2 id="page-title">Visit more to win rewards!</h2>
        <p id="page-sub"></p>
      </header>

      <div class="page-sheet">
        <ol class="timeline" id="timeline"></ol>
      </div>

      <div class="page-footer">
        <button type="button" class="primary" id="page-go-back">Go back</button>
      </div>
    </div>
  </div>

  <!-- Visit completed pop-up -->
  <div class="overlay popup-overlay" id="visit-popup" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <div class="popup-burst" aria-hidden="true">🎉</div>
      <h2 id="popup-title"></h2>
      <p class="popup-sub" id="popup-sub"></p>

      <div class="popup-reward" id="popup-reward" hidden>
        <span class="popup-reward-icon" id="popup-reward-icon" aria-hidden="true"></span>
        <div>
          <strong id="popup-reward-title"></strong>
          <p id="popup-reward-text"></p>
        </div>
      </div>

      <button type="button" class="claim-btn" id="popup-view" hidden>View my reward</button>
      <button type="button" class="popup-close" id="popup-close">Continue</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden>Visit counted ✓</div>

  <!-- Google callback: must be a global function -->
  <script>
    async function handleGoogle(response) {
      const err = document.getElementById("google-error");
      try {
        const r = await fetch("/api/google-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) {
          location.reload(); // script.js then shows the rewards view
        } else {
          err.textContent = data.error || "Google sign-in failed. Try again.";
          err.hidden = false;
        }
      } catch (e) {
        err.textContent = "Network error. Try again.";
        err.hidden = false;
      }
    }
  </script>

  <!-- Fills in the Instagram and Facebook links from the values set on the server -->
  <script>
    fetch("/api/config")
      .then((response) => response.json())
      .then((config) => {
        const insta = document.getElementById("insta-link");
        if (insta && config.instagramUrl) {
          insta.href = config.instagramUrl;
          insta.hidden = false;
        }

        const fb = document.getElementById("fb-link");
        if (fb && config.facebookUrl) {
          fb.href = config.facebookUrl;
          fb.hidden = false;
        }
      })
      .catch(() => {});
  </script>

  <script src="script.js"></script>
</body>
</html>
